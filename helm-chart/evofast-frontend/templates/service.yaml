apiVersion: v1
kind: Service
metadata:
  name: {{ include "evofast-frontend.fullname" . }}-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "evofast-frontend.name" . }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
