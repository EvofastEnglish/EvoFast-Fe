name: Build-Push Docker Image 

on:
  push:
    branches:
      - 'develop-aks'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.SOLOCODE_USERNAME }}
          password: ${{ secrets.SOLOCODE_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.SOLOCODE_USERNAME }}/evofast-frontend-aks:latest

      -
        name: Create trigger 
        run: |
          curl -k "https://lieudvq0302:114cc4eb6e926ebcb4a481b76c3ca1f9d1@jenkins.solocode.click/job/evofast-frontend/build?token=buildtoken"